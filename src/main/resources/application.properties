spring.application.name=hoabs
server.port=${SERVER_PORT:8080}

# Database Configuration (Defaults to in-memory H2 in PostgreSQL mode; seamlessly switches to Postgres if DATABASE_URL is supplied)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:hoabs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator / Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# SpringDoc OpenAPI & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method

# HOABS Specific Settings
hoabs.jwt.secret=${JWT_SECRET:hoabs-amahoro-general-hospital-super-secret-key-2026-minimum-32-chars!}
hoabs.jwt.issuer=hoabs-amahoro
hoabs.jwt.ttl=PT8H
hoabs.jwt.idle-timeout=PT30M
hoabs.lockout.max-attempts=3
hoabs.lockout.duration=PT30M
hoabs.payment.stub-mode=${PAYMENT_STUB_MODE:SUCCESS}
hoabs.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
hoabs.seed.enabled=true
