services:
  hoabs-db:
    image: postgres:16-alpine
    container_name: hoabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hoabs_db}
      POSTGRES_USER: ${DB_USER:-hoabs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hoabs_secret_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hoabs_user} -d ${DB_NAME:-hoabs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hoabs-net

  hoabs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoabs-backend
    restart: unless-stopped
    depends_on:
      hoabs-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://hoabs-db:5432/${DB_NAME:-hoabs_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-hoabs_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-hoabs_secret_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      HOABS_SECURITY_JWT_SECRET: ${JWT_SECRET:-hoabs-super-secret-key-32-chars-minimum-amahoro-hospital-rwanda-2026}
      HOABS_SECURITY_JWT_EXPIRATION_SECONDS: 28800
      HOABS_SCHEDULING_APPOINTMENT_LEAD_HOURS: 2
      HOABS_SCHEDULING_MAX_ACTIVE_PER_PATIENT: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - hoabs-net

volumes:
  postgres_data:
    driver: local

networks:
  hoabs-net:
    driver: bridge
